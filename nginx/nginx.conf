upstream gateway {
    server gateway:8080;
    # Reuse TCP connections to the gateway instead of a handshake per request.
    keepalive 32;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # No upload features; keep request bodies small to limit abuse surface.
    client_max_body_size 1m;

    # All API traffic → gateway (dynamic routing + auth happens there)
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → gateway. The client pings every 30s ({t:"ping"} on the game
    # socket), so a 300s read timeout reaps dead connections while keeping
    # healthy ones alive.
    location /ws/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
