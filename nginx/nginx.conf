upstream gateway {
    server gateway:8080;
    # Reuse TCP connections to the gateway instead of a handshake per request.
    keepalive 32;
}

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    server_name chessblitz.in www.chessblitz.in;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server
server {
    listen 443 ssl;
    server_name chessblitz.in www.chessblitz.in;

    root /usr/share/nginx/html;
    index index.html;
    # No upload features; keep request bodies small to limit abuse surface.
    client_max_body_size 1m;

    # SSL Certificates (mounted from host)
    ssl_certificate /etc/letsencrypt/live/chessblitz.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chessblitz.in/privkey.pem;

    # SSL Optimizations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # All API traffic → gateway
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → gateway. The client pings every 30s ({t:"ping"} on the game
    # socket), so a 300s read timeout reaps dead connections while keeping
    # healthy ones alive.
    location /ws/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
